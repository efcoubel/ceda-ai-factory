const META = document.querySelector('meta[name="ai-factory-validation"]');
const T = TEXT[META.dataset.lang] || TEXT.en;
const ORDER = ["human_task", "plan", "ship", "review_answers", "merge_staging", "comment", "create_ticket", "review_comments", "nudge", "assign", "transition", "cleanup"];
const ROUTINE = new Set(["assign", "transition", "cleanup"]);

let rows = [], filter = "all", col = null;
const busy = new Set(), mode = new Map(), drafts = new Map(), opened = new Map(), cache = new Map(), errors = new Map();
try { filter = localStorage.getItem("filter") || "all"; } catch (e) {}

const parse = iso => new Date(String(iso || "").replace(" ", "T"));

const time = iso => el("time", { datetime: iso || "", title: when(iso) }, ago(iso));
const body = r => r.content == null ? "" : typeof r.content === "string" ? r.content : JSON.stringify(r.content, null, 2);
const typeName = r => T.types[r.type] || r.type || "";

const list = v => Array.isArray(v) ? v.filter(Boolean) : [];

        else break;
      }
      box.append(el(ordered ? "ol" : "ul", {}, ...items.map(t => el("li", {}, ...inline(t)))));
      continue;
    }
    if (/^\s{2,}\S/.test(l)) {
      const code = [];
      while (i < lines.length && /^\s{2,}\S/.test(lines[i])) code.push(lines[i++].replace(/^\s{2}/, ""));
      box.append(codeBlock(code.join("\n"))); continue;
    }
    if (/^>\s?/.test(l)) {
      const quote = [];
      while (i < lines.length && /^>\s?/.test(lines[i])) quote.push(lines[i++].replace(/^>\s?/, ""));
      box.append(el("blockquote", {}, ...inline(quote.join(" ")))); continue;
    }
    const para = [];
    while (i < lines.length && lines[i].trim() && !/^(#{1,6}\s|\s*```|\s*\||\s*[-*]\s|\s*\d+\.\s|\s{2,}\S|>)/.test(lines[i])) para.push(lines[i++].trim());
    if (!para.length) para.push(lines[i++].trim());
    box.append(el("p", {}, ...inline(para.join(" "))));
  }
  return box;
}

async function decide(id, status, note, answers) {
  if (busy.has(id)) return;
  busy.add(id); errors.delete(id); render();
  try {
    const fields = { status, decided_at: new Date().toISOString() };
    if (note !== undefined) fields.note = note;
    if (answers !== undefined) fields.answers = answers;
    await col.doc(id).update(fields);
    mode.delete(id); drafts.delete(id);
  } catch (e) { errors.set(id, T.saveFailed(e.code || "error")); }
  finally { busy.delete(id); render(); }
}

function draft(r) {
  if (!drafts.has(r.id)) drafts.set(r.id, { answers: Object.fromEntries(questions(r).map(q => [q.id, { choice: q.proposed ? "proposed" : null, text: "" }])), note: "" });
  return drafts.get(r.id);
}
function answerState(r) {
  const d = draft(r), missing = [], answers = [];
  let free = false, picked = false;
  questions(r).forEach((q, i) => {
    const a = d.answers[q.id] || {};
    if (!a.choice || (a.choice === "other" && !a.text.trim())) { missing.push(i + 1); return; }
    if (a.choice === "proposed") return;
    if (a.choice === "other") { free = true; answers.push({ id: q.id, question: q.text, answer: a.text.trim() }); }
    else { picked = true; answers.push({ id: q.id, question: q.text, answer: list(q.options)[a.choice - 1] }); }
  });
  return { missing, answers, free, picked };
}

function questionBlock(r, q, n, refresh) {
  const d = draft(r).answers[q.id], name = "q-" + r.id + "-" + q.id;
  const other = el("textarea", { id: name + "-text", "aria-label": T.otherPlaceholder, placeholder: T.otherPlaceholder, hidden: d.choice !== "other" });
  other.value = d.text;
  other.addEventListener("input", () => { d.text = other.value; refresh(); });
  const pick = choice => () => { d.choice = choice; other.hidden = choice !== "other"; if (choice === "other") other.focus(); refresh(); };
  const choice = (value, label, tag) => el("label", { class: "choice" },
    el("input", { type: "radio", name, checked: d.choice === value, onchange: pick(value) }),
    el("span", {}, label, tag ? el("small", {}, " · " + tag) : null));
  return el("fieldset", {},
    el("legend", { class: "q-text" }, `${n}. ${q.text}`, q.proposed ? null : el("span", { class: "tag needs" }, T.needsYou)),
    q.why ? el("p", { class: "q-why" }, q.why) : null,
    q.proposed ? choice("proposed", q.proposed, T.proposed) : null,
    ...list(q.options).map((o, i) => choice(i + 1, o)),
    choice("other", T.other), other);
}

function decisionZone(r, zone) {
  const human = r.type === "human_task", id = r.id, m = mode.get(id), locked = busy.has(id);
  const buttons = [];
  if (m) {
    const reject = m === "reject";
    const ta = el("textarea", { id: "note-" + id, "aria-label": T.yourAnswer, placeholder: reject ? T.rejectPlaceholder : T.notePlaceholder });
    ta.value = draft(r).note;
    ta.addEventListener("input", () => { draft(r).note = ta.value; err.textContent = ""; });
    const err = el("p", { class: "err", role: "alert" });
    const hint = reject ? el("p", { class: "hint" }, r.type === "plan" ? T.rejectPlan : T.rejectHint) : null;
    const go = el("button", { type: "button", class: "do " + (reject ? "danger" : "primary"), disabled: locked, onclick: () => {
      const v = ta.value.trim();
      if (reject) { decide(id, "rejected", v || undefined); return; }
      if (!v) { err.textContent = T.noteMissing; ta.focus(); return; }
      decide(id, "changed", v);
    } }, reject ? T.rejectConfirm : T.send);
    zone.replaceChildren(el("div", { class: "edit" }, ta, hint, err,
      el("div", { class: "actions" }, go, el("button", { type: "button", class: "do", onclick: () => { mode.delete(id); render(); } }, T.cancel))));
    setTimeout(() => { if (document.activeElement === document.body) ta.focus(); });
    return;
  }
  const { missing, answers, free, picked } = answerState(r);
  const open = next => () => { mode.set(id, next); render(); };
  if (human) buttons.push(
    el("button", { type: "button", class: "do primary", disabled: locked, onclick: () => decide(id, "done") }, T.done),
    el("button", { type: "button", class: "do", disabled: locked, onclick: open("edit") }, T.stuck),
    el("button", { type: "button", class: "do danger", disabled: locked, onclick: open("reject") }, T.drop));
  else {
    const note = answers.map(a => `${a.question} → ${a.answer}`).join("\n");
    const label = free ? T.sendAnswers : picked ? T.approveAnswers : T.approve;
    const go = () => free ? decide(id, "changed", note, answers) : decide(id, "ok", undefined, answers.length ? answers : undefined);
    buttons.push(
      el("button", { type: "button", class: "do primary", disabled: locked || missing.length > 0, onclick: go }, label),
      el("button", { type: "button", class: "do", disabled: locked, onclick: open("edit") }, T.change),
      el("button", { type: "button", class: "do danger", disabled: locked, onclick: open("reject") }, T.reject));
  }
  const hint = missing.length ? el("p", { class: "hint must" }, T.answerFirst(missing.join(", "))) : free ? el("p", { class: "hint" }, T.sendHint) : null;
  zone.replaceChildren(...(hint ? [hint] : []), ...buttons);
}

function detail(r, startOpen) {
  const text = body(r), files = list(r.files);
  if (!text && !files.length) return null;
  const minutes = Math.round(text.length / 1200);
  const d = el("details", { open: opened.has(r.id) ? opened.get(r.id) : startOpen },
    el("summary", {}, minutes >= 2 ? T.detailRead(minutes) : T.detail),
    text ? markdown(text) : null,
    files.length ? el("p", { class: "files" }, `${T.files}${T.colon}${files.join(" · ")}`) : null);
  d.addEventListener("toggle", () => opened.set(r.id, d.open));
  return d;
}

function feedback(r) {
  if (r.reply) return el("div", { class: "feedback" }, el("b", {}, T.reply), el("p", {}, r.reply));
  if (r.note) return el("div", { class: "feedback" }, el("b", {}, r.rewritten_at ? T.yourNote : T.note), el("p", {}, r.note));
  return null;
}
function block(label, items, cls) {
  return items.length ? el("div", { class: "block " + (cls || "") }, el("span", { class: "block-label" }, label), el("ul", {}, ...items.map(i => el("li", {}, ...inline(i))))) : null;
}

function card(r) {
  const human = r.type === "human_task", qs = questions(r), briefed = r.why || list(r.effects).length || list(r.watch).length || qs.length;
  const needs = qs.some(q => !q.proposed), wait = waits(r);
  const zone = el("div", { class: "actions" });
  const refresh = () => decisionZone(r, zone);
  const c = el("article", { class: "card" },
    el("div", { class: "kicker" }, el("span", { class: "tag" }, typeName(r)), needs ? el("span", { class: "tag needs" }, T.needsYou) : null, time(r.rewritten_at || r.created_at)),
    feedback(r),
    el("h3", { class: "ask" }, r.summary || typeName(r)),
    r.why ? el("p", { class: "why" }, ...inline(r.why)) : null,
    wait ? el("p", { class: "waits" }, T.waits(wait)) : null,
    block(T.ifOk[r.type] || T.ifOkDefault, list(r.effects)),
    block(T.watch, list(r.watch), "watch"),
    qs.length ? el("div", { class: "questions" }, ...qs.map((q, i) => questionBlock(r, q, i + 1, refresh))) : null,
    detail(r, human || !briefed),
    errors.has(r.id) ? el("p", { class: "err", role: "alert" }, errors.get(r.id)) : null,
    zone);
  refresh();
  return c;
}
function cached(id, sig, make) {
  const hit = cache.get(id);
  if (hit && hit.sig === sig) return hit.node;
  const node = make();
  cache.set(id, { sig, node });
  return node;
}
const sigOf = r => JSON.stringify([r, mode.get(r.id), busy.has(r.id), errors.get(r.id), waits(r)]);

function ticketBlock(ticket, group) {
  const first = group.find(r => r.ticket_title) || group[0];
  const head = cached("head-" + ticket, JSON.stringify([first.ticket_url, first.ticket_title]), () =>
    el("div", { class: "ticket-head" }, key(first), first.ticket_title ? el("span", { class: "ticket-title" }, first.ticket_title) : null));
  const box = cached("ticket-" + ticket, "", () => el("div", { class: "ticket" }));
  sync(box, [head, ...group.map(r => cached(r.id, sigOf(r), () => card(r)))]);
  return box;
}
const rank = g => g.some(r => questions(r).some(q => !q.proposed)) ? 0 : g.some(r => r.type === "human_task") ? 1 : 2;
const position = r => { const i = ORDER.indexOf(r.type); return i < 0 ? ORDER.length : i; };

function routineRow(r) {
  const summary = r.summary || typeName(r), sub = body(r).replace(/\s+/g, " ").trim();
  return el("div", { class: "row" },
    el("div", { class: "row-text" }, el("div", { class: "row-title" }, key(r), el("span", {}, summary)), sub ? el("span", { class: "row-sub" }, sub) : null,
      errors.has(r.id) ? el("p", { class: "err", role: "alert" }, errors.get(r.id)) : null),
    el("div", { class: "row-do" }, el("button", { type: "button", class: "do small", disabled: busy.has(r.id), onclick: () => decide(r.id, "ok") }, T.approve)));
}
function movingRow(r) {
  const wait = waits(r), sub = r.status === "changed" ? T.waitsNote : wait ? T.waits(wait) : T.waitsTick;
  return el("div", { class: "row" },
    el("div", { class: "row-text" }, el("div", { class: "row-title" }, key(r), el("span", {}, r.summary || typeName(r))), el("span", { class: "row-sub" }, sub),
      r.note ? el("span", { class: "row-sub" }, r.note) : null, errors.has(r.id) ? el("p", { class: "err", role: "alert" }, errors.get(r.id)) : null),
    el("div", { class: "row-do" }, el("span", { class: "st st-" + r.status }, T.statuses[r.status] || r.status),
      r.status === "ok" ? el("button", { type: "button", class: "do small", disabled: busy.has(r.id), onclick: () => decide(r.id, "pending") }, T.undo) : null));
}
function historyRow(r) {
  const d = el("details", {},
    el("summary", {}, key(r), el("span", { class: "st st-" + r.status }, T.statuses[r.status] || r.status), el("span", {}, r.summary || typeName(r)), time(r.handled_at || r.decided_at || r.created_at)),
    el("div", { class: "body" }, r.note ? el("p", { class: "err" }, r.note) : null, body(r) ? markdown(body(r)) : null));
  return d;
}

function render() {
  const pilots = new Set(rows.map(r => r.pilot).filter(Boolean));
  const fbox = document.getElementById("filters");
  fbox.hidden = pilots.size < 2;
  if (pilots.size < 2) filter = "all";
  fbox.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.f === filter)));

  const visible = rows.filter(r => filter === "all" || r.pilot === filter);
  const pending = visible.filter(r => r.status === "pending");
  const routine = pending.filter(isRoutine), decisions = pending.filter(r => !isRoutine(r));
  const moving = visible.filter(r => r.status === "ok" || r.status === "changed");
  const history = visible.filter(r => ["done", "rejected", "failed"].includes(r.status));
  const failed = history.filter(r => r.status === "failed").length;
  const answers = decisions.filter(r => questions(r).some(q => !q.proposed)).length;

  const groups = new Map();
  decisions.forEach(r => { const k = r.ticket || "—"; groups.set(k, [...(groups.get(k) || []), r]); });
  const ordered = [...groups.entries()].map(([k, g]) => [k, g.sort((a, b) => position(a) - position(b))])
    .sort((a, b) => rank(a[1]) - rank(b[1]) || String(a[1][0].created_at).localeCompare(String(b[1][0].created_at)));
  const box = document.getElementById("decide");
  if (ordered.length) { box.className = "ticket-list"; box.style.cssText = "display:flex;flex-direction:column;gap:24px;min-width:0"; sync(box, ordered.map(([k, g]) => ticketBlock(k, g))); }
  else { box.className = "empty"; box.style.cssText = ""; box.replaceChildren(T.empty); }

  document.getElementById("s-routine").hidden = !routine.length;
  sync(document.getElementById("routine"), routine.map(r => cached("r-" + r.id, sigOf(r), () => routineRow(r))));
  document.getElementById("routine-all").replaceChildren(el("button", { type: "button", class: "do small", onclick: async () => { for (const r of routine) await decide(r.id, "ok"); } }, T.approveAll(routine.length)));
  document.getElementById("s-moving").hidden = !moving.length;
  sync(document.getElementById("moving"), moving.map(r => cached("m-" + r.id, sigOf(r), () => movingRow(r))));
  document.getElementById("s-history").hidden = !history.length;
  document.getElementById("h-history").textContent = T.history(history.length, failed);
  sync(document.getElementById("history"), history.map(r => cached("h-" + r.id, sigOf(r), () => historyRow(r))));

  const part = (label, n) => n ? [el("span", {}, label + T.colon, el("b", {}, String(n)))] : [];
  const parts = [...part(T.tally.decide, decisions.length), ...part(T.tally.answers, answers), ...part(T.tally.routine, routine.length), ...part(T.tally.moving, moving.length), ...part(T.tally.failed, failed)];
  document.getElementById("tally").replaceChildren(...parts.flatMap((p, i) => i ? [" · ", p] : [p]));
}

document.title = META.dataset.project ? `${META.dataset.project} · ${T.title}` : T.title;
document.getElementById("title").textContent = META.dataset.project ? `${META.dataset.project} · ${T.title}` : T.title;
document.getElementById("h-decide").textContent = T.decide;
document.getElementById("h-routine").textContent = T.routine;
document.getElementById("routine-hint").textContent = T.routineHint;
document.getElementById("h-moving").textContent = T.moving;
document.getElementById("decide").textContent = T.loading;
document.getElementById("filters").append(...["all", "support", "dev"].map(f => el("button", { type: "button", "data-f": f, onclick: () => {
  filter = f; try { localStorage.setItem("filter", f); } catch (e) {} render();
} }, T.filters[f])));

(async () => {
  const db = await claude.use("db");
  if (!db) { document.getElementById("tally").textContent = T.unavailable; return; }
  col = db.collection("actions");
  let open = [], handled = [];
  const merge = () => {
    rows = [...open, ...handled].sort((a, b) => String(b.created_at || "").localeCompare(String(a.created_at || "")));
    render();
  };
  const failed = e => { document.getElementById("tally").textContent = T.readFailed(e.code); };
  col.where("status", "in", ["pending", "ok", "changed"]).onSnapshot(snap => {
    open = snap.docs.map(d => ({ id: d.id, ...d.data() })); merge();
  }, failed);
  col.where("status", "in", ["done", "rejected", "failed"]).orderBy("created_at", "desc").limit(60).onSnapshot(snap => {
    handled = snap.docs.map(d => ({ id: d.id, ...d.data() })); merge();
  }, failed);
})();
</script>
